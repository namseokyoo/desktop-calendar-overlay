name: Windows Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows desktop app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\DesktopCalendarOverlay.sln

      - name: Build
        run: dotnet build .\DesktopCalendarOverlay.sln --configuration Release --no-restore

      - name: Publish self-contained Windows x64 single-file
        run: >-
          dotnet publish .\src\DesktopCalendarOverlay\DesktopCalendarOverlay.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output .\artifacts\publish\desktop-calendar-overlay-win-x64

      - name: Inject official Google OAuth desktop client when configured
        if: ${{ secrets.DCO_GOOGLE_OAUTH_CLIENT_JSON_B64 != '' }}
        shell: pwsh
        env:
          DCO_GOOGLE_OAUTH_CLIENT_JSON_B64: ${{ secrets.DCO_GOOGLE_OAUTH_CLIENT_JSON_B64 }}
        run: |
          $target = '.\artifacts\publish\desktop-calendar-overlay-win-x64\google-oauth-client.official.json'
          [System.IO.File]::WriteAllBytes($target, [Convert]::FromBase64String($env:DCO_GOOGLE_OAUTH_CLIENT_JSON_B64))
          $json = Get-Content -Raw -Path $target | ConvertFrom-Json
          if (-not $json.installed.client_id -or -not $json.installed.client_secret) {
            throw 'Official Google OAuth client secret must be a Desktop app JSON with installed.client_id and installed.client_secret.'
          }
          Write-Host 'Official Google OAuth client JSON injected into publish output.'

      - name: Create release zips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\release | Out-Null
          Compress-Archive -Path .\artifacts\publish\desktop-calendar-overlay-win-x64\* -DestinationPath .\artifacts\release\desktop-calendar-overlay-win-x64.zip -Force
          Get-ChildItem .\artifacts\release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-calendar-overlay-win-x64
          path: .\artifacts\release\*.zip
          if-no-files-found: error

      - name: Publish GitHub Release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: .\artifacts\release\*.zip
          generate_release_notes: true
