name: Windows Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows desktop app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\DesktopCalendarOverlay.sln

      - name: Build
        run: dotnet build .\DesktopCalendarOverlay.sln --configuration Release --no-restore

      - name: Publish self-contained Windows x64
        run: >-
          dotnet publish .\src\DesktopCalendarOverlay\DesktopCalendarOverlay.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output .\artifacts\publish\desktop-calendar-overlay-win-x64

      - name: Create release zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\release | Out-Null
          Compress-Archive -Path .\artifacts\publish\desktop-calendar-overlay-win-x64\* -DestinationPath .\artifacts\release\desktop-calendar-overlay-win-x64.zip -Force
          Get-ChildItem .\artifacts\release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-calendar-overlay-win-x64
          path: .\artifacts\release\desktop-calendar-overlay-win-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: .\artifacts\release\desktop-calendar-overlay-win-x64.zip
          generate_release_notes: true
