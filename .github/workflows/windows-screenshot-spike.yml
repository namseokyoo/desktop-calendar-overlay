name: Windows Screenshot Spike

on:
  push:
    branches:
      - ci/windows-screenshot-spike
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    name: Build, launch, and capture WPF screenshot
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\DesktopCalendarOverlay.sln

      - name: Publish diagnostic folder build
        run: >-
          dotnet publish .\src\DesktopCalendarOverlay\DesktopCalendarOverlay.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          --output .\artifacts\publish\desktop-calendar-overlay-win-x64

      - name: Launch app and capture screen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .\artifacts\screenshots | Out-Null
          New-Item -ItemType Directory -Force -Path .\artifacts\logs | Out-Null

          $exe = Resolve-Path .\artifacts\publish\desktop-calendar-overlay-win-x64\DesktopCalendarOverlay.exe
          "exe=$exe" | Out-File .\artifacts\logs\screenshot-spike.log -Encoding utf8

          $proc = Start-Process -FilePath $exe -PassThru
          "pid=$($proc.Id)" | Out-File .\artifacts\logs\screenshot-spike.log -Append -Encoding utf8

          Start-Sleep -Seconds 12
          $proc.Refresh()
          "hasExited=$($proc.HasExited)" | Out-File .\artifacts\logs\screenshot-spike.log -Append -Encoding utf8
          if ($proc.HasExited) {
            "exitCode=$($proc.ExitCode)" | Out-File .\artifacts\logs\screenshot-spike.log -Append -Encoding utf8
          }

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Win32 {
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          "@
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "screen=$($bounds.Width)x$($bounds.Height) at $($bounds.X),$($bounds.Y)" | Out-File .\artifacts\logs\screenshot-spike.log -Append -Encoding utf8

          # Cover the runner console/log desktop with a clean portfolio backdrop so the transparent overlay
          # captures like a product screenshot rather than a CI diagnostic desktop.
          $backdrop = New-Object System.Windows.Forms.Form
          $backdrop.Text = 'Desktop Calendar Overlay portfolio backdrop'
          $backdrop.FormBorderStyle = [System.Windows.Forms.FormBorderStyle]::None
          $backdrop.StartPosition = [System.Windows.Forms.FormStartPosition]::Manual
          $backdrop.Bounds = $bounds
          $backdrop.BackColor = [System.Drawing.Color]::FromArgb(13, 18, 30)
          $backdrop.ShowInTaskbar = $false
          $backdrop.Show()
          $backdrop.BringToFront()
          [System.Windows.Forms.Application]::DoEvents()
          Start-Sleep -Seconds 1

          $main = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if ($main -and $main.MainWindowHandle -ne 0) {
            [Win32]::ShowWindow($main.MainWindowHandle, 3) | Out-Null # SW_MAXIMIZE
            [Win32]::SetForegroundWindow($main.MainWindowHandle) | Out-Null
            "maximizedHandle=$($main.MainWindowHandle)" | Out-File .\artifacts\logs\screenshot-spike.log -Append -Encoding utf8
            Start-Sleep -Seconds 3
          } else {
            "maximizedHandle=not-found" | Out-File .\artifacts\logs\screenshot-spike.log -Append -Encoding utf8
          }

          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $graphics.Dispose()
          $bitmap.Save((Resolve-Path .\artifacts\screenshots).Path + '\desktop-calendar-overlay-maximized-fullscreen.png', [System.Drawing.Imaging.ImageFormat]::Png)
          $bitmap.Dispose()

          Get-Process | Where-Object { $_.ProcessName -like '*DesktopCalendarOverlay*' } | Select-Object ProcessName, Id, MainWindowTitle, MainWindowHandle | Format-Table -AutoSize | Out-String | Out-File .\artifacts\logs\processes.txt -Encoding utf8

          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload screenshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-calendar-overlay-screenshot-spike
          path: |
            .\artifacts\screenshots\*.png
            .\artifacts\logs\*.log
            .\artifacts\logs\*.txt
          if-no-files-found: error
